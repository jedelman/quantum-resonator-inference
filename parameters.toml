# System Design Parameters
# RULE: Every entry MUST have an explicit rationale.
# Rationale must reference either physics derivation, experimental data, or constraint from architecture.
# No arbitrary numbers.

[optical]
wavelength_nm = 850
# Rationale: GaAs VCSEL OTS maturity at 850nm. PTR glass transparent 300-3000nm.
# Si PD responsivity 0.6 A/W at 850nm. Fiber abundant. Glass Brain validated choice.
# Consistent with Glass Brain 2026-04-17 session locked decision.

[token_embedding]
dimension = 512
# Rationale: Placeholder for target model. Must equal number of spatial modes N excited
# at resonator input. N ≥ 512 requires aperture supporting 512 orthogonal TEM_mn modes.
# At 850nm, aperture ~ 22.6mm for 50um mode spacing (TBD in ARCH-3).

[resonator]
# All TBD pending ARCH-2 derivation. Do not insert placeholder values.
geometry = "Fabry-Perot"
# Rationale: ARCH-1 LOCKED. Simplest geometry, well-characterized standing-wave modes,
# retroreflection naturally implements the u_{t-1} term in wave equation RNN (eq. 1).
# Hughes 2019 exact mapping applies directly.

medium = "PTR_glass"
# Rationale: ARCH-1 LOCKED. Non-volatile holographic weight storage. Δn(x,y) = trained
# weight distribution. Thermally fixed. Transparent at 850nm. Psaltis 1990 + Glebov 2010.

round_trips_T = "TBD"
# Rationale: Depends on round-trip loss budget. T_max = -log(SNR_threshold) / log(1/R_eff)
# where R_eff = product of all round-trip losses (mirror R, PTR absorption, diffraction).
# Derive in ARCH-2.

cavity_length_L_mm = "TBD"
# Rationale: Sets FSR = c/2L and round-trip time tau = 2L/c.
# Token throughput = 1 / (T * tau). Must satisfy tau << 1/token_rate.
# Derive in ARCH-4.

mirror_reflectivity_R = "TBD"
# Rationale: Drives round-trip loss budget. Higher R → more round trips (depth) but
# harder to in/out-couple. Typical high-reflectivity: R > 0.99. Derive in ARCH-2.

[spatial]
pixel_pitch_um = 50
# Rationale: Conservative choice. Matches Glass Brain plate spec.
# Safety margin: 50um >> lambda/2 = 0.425um (117x diffraction limit).
# Allows 512 modes across ~25mm aperture.

aperture_mm = "TBD"
# Rationale: Must support N = 512 modes with 50um spacing → ~25.6mm minimum.
# Actual aperture set by PTR glass availability and Fabry-Perot mirror size.
# Derive in ARCH-3.

[snr]
target_bits = 6
# Rationale: 6-bit precision sufficient for transformer inference.
# Established by quantization literature: Dettmers et al. 2022 (LLM.int8()),
# Frantar et al. 2022 (GPTQ). 6-bit: SNR_required = 6.02*6 + 1.76 = 37.9 dB.
target_snr_dB = 38.0

[interposer]
# Reuse Glass Brain interposer design (validated 2026-04-17)
detector = "Si_PIN_850nm"
amplifier = "TIA_180nm_CMOS"
nonlinearity = "analog_comparator_GeLU"
emitter = "GaAs_VCSEL_850nm"
latency_ns_per_layer = 67
# Rationale: Glass Brain derivation: 67ns/block. Identical architecture reused.
power_W_per_head = 1.32
# Rationale: Glass Brain derivation: 1.32W/head (256 neurons). Reused.

[model]
# Target embedded model parameters (TBD — depends on resonator capacity from ARCH-7)
target_params = "TBD"
layers = "TBD"
embedding_dim = 512
# Rationale: Placeholder. Set to match [token_embedding].dimension above.

[power]
# TBD — derive after resonator geometry and layer count are locked
# Key constraint: embedded device. Power budget << server GPU.
facility_W = "TBD"
target_per_token_mJ = "TBD"

